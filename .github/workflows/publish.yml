name: cohort360-frontend-publish

on:
  workflow_run:
    workflows: [cohort360-frontend-test]
    types: [completed]
    branches:
      - main
      - develop

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set version from package.json
        run: echo "VERSION=$(jq -r .version package.json)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ github.event.workflow_run.head_branch == 'main' && format('aphpid/cohort360-frontend:{0},aphpid/cohort360-frontend:latest', env.VERSION) || format('aphpid/cohort360-frontend:{0}', env.VERSION) }}

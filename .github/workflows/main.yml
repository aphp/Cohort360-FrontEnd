name: cohort360-main-pipeline

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 22.x
  SONAR_TEST_BRANCH: branch-run-sonar
  SONAR_TEST_TAG: run-sonar
  TZ: Europe/Paris

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Type-check
        run: npx tsc --noEmit

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run tests with coverage
        run: npm run coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: error

  sonar:
    if: >
      github.ref == 'refs/heads/main'
      || github.ref == 'refs/heads/develop'
      || github.ref == 'refs/tags/run-sonar'
      || startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'pull_request'
    needs:
      - lint
      - typecheck
      - tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Retrieve version
        id: package_version
        run: |
          VERSION=$(python3 - <<'PY'
          import json
          with open("package.json", encoding="utf-8") as package_file:
              print(json.load(package_file)["version"])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage

      - name: Set Sonar branch name for test tag
        id: sonar_branch
        if: github.ref == 'refs/tags/run-sonar'
        run: echo "args=-Dsonar.branch.name=$SONAR_TEST_BRANCH" >> "$GITHUB_OUTPUT"

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: >
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
          && env.SONAR_TOKEN != ''
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.package_version.outputs.version }}
            -Dsonar.organization=aphp
            -Dsonar.projectKey=aphp_Cohort360
            -Dsonar.javascript.lcov.reportPaths=./coverage/lcov.info
            ${{ steps.sonar_branch.outputs.args }}

  publish:
    if: github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/tags/run-sonar')
    needs:
      - lint
      - typecheck
      - tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read version
        id: package_version
        run: |
          VERSION=$(python3 - <<'PY'
          import json
          with open("package.json", encoding="utf-8") as package_file:
              print(json.load(package_file)["version"])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check correct tag and version
        env:
          VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          CI_COMMIT_TAG=$(git tag --points-at HEAD | head -n 1)
          if [ -n "$CI_COMMIT_TAG" ] && [ "$CI_COMMIT_TAG" != "$VERSION" ] && case "$VERSION" in *SNAPSHOT) false;; *) true;; esac; then
            echo "The version is not the same as the tag name"
            exit 1
          fi
          echo "Publishing version $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ github.ref == 'refs/heads/main' && format('aphpid/cohort360-frontend:{0},aphpid/cohort360-frontend:latest', steps.package_version.outputs.version) || format('aphpid/cohort360-frontend:{0}', steps.package_version.outputs.version) }}

name: cohort360-frontend-test

on:
  pull_request:
    branches:
      - develop
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22.x
  TZ: Europe/Paris

jobs:
  pr-target-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vers main — uniquement hotfix/** ou release/**
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        run: |
          case "${{ github.head_ref }}" in
            hotfix/*|release/*) ;;
            *)
              echo "::error title=PR invalide vers main::Seules les branches hotfix/** ou release/** peuvent cibler main (reçu: ${{ github.head_ref }})."
              exit 1
              ;;
          esac
      - name: Garde OK
        run: echo "PR target OK"

  lint:
    needs: [pr-target-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: szenius/set-timezone@1f9716b0f7120e344f0c62bb7b1ee98819aefd42 # v2.0
        with:
          timezoneLinux: ${{ env.TZ }}

      - name: Install dependencies
        run: npm ci --no-audit --ignore-scripts

      - name: Lint
        run: npm run lint

  typecheck:
    needs: [pr-target-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: szenius/set-timezone@1f9716b0f7120e344f0c62bb7b1ee98819aefd42 # v2.0
        with:
          timezoneLinux: ${{ env.TZ }}

      - name: Install dependencies
        run: npm ci --no-audit --ignore-scripts

      - name: Type-check
        run: npx tsc --noEmit

  test:
    needs: [pr-target-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: szenius/set-timezone@1f9716b0f7120e344f0c62bb7b1ee98819aefd42 # v2.0
        with:
          timezoneLinux: ${{ env.TZ }}

      - name: Install dependencies
        run: npm ci --no-audit --ignore-scripts

      - name: Run tests with coverage
        run: npm run coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: error

  sonar_precheck:
    needs: [pr-target-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_sonar_token: ${{ steps.check.outputs.has_sonar_token }}
    steps:
      - name: Check Sonar token availability
        id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "has_sonar_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sonar_token=false" >> "$GITHUB_OUTPUT"
          fi

  sonar:
    if: >
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && needs.sonar_precheck.outputs.has_sonar_token == 'true'
    needs: [lint, typecheck, test, sonar_precheck]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Retrieve version
        run: echo "VERSION=$(jq -r .version package.json)" >> "$GITHUB_ENV"

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ env.VERSION }}
            -Dsonar.organization=aphp
            -Dsonar.projectKey=aphp_Cohort360
            -Dsonar.javascript.lcov.reportPaths=./coverage/lcov.info
            -Dsonar.verbose=true
